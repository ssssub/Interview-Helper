name: Wake up Streamlit App

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a request to wake up the app
        run: |
          # -L을 빼고, 상태 코드만 확인하여 에러 없이 종료되도록 설정
          curl -s -o /dev/null -I -w "Status: %{http_code}\n" https://interview-apper-wfeq2abzgdqyqf28hx9ktq.streamlit.app/
